name: Build sea-cove fishing gear sprites
on:
  push:
    branches: [feature/sea-cove-fishing-hamlet]
    paths:
      - 'tools/generate-cove-fishing-gear.py'
      - '.github/workflows/build-cove-fishing-gear.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate original native-size pixel sprites
        run: python3 tools/generate-cove-fishing-gear.py
      - name: Verify real PNG dimensions and transparency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          expected={
            'net-drying-rack-192x150.png':(192,150),
            'net-bundle-112x66.png':(112,66),
            'rope-coil-68x50.png':(68,50),
          }
          for name,dim in expected.items():
            p=Path('assets/sea-cove/objects')/name
            b=p.read_bytes()
            assert b[:8]==b'\x89PNG\r\n\x1a\n'
            assert struct.unpack_from('>II',b,16)==dim
            assert (b[24],b[25])==(8,6),p
            print(name,len(b),dim)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sea-cove-fishing-gear
          path: assets/sea-cove/objects/*.png
          if-no-files-found: error
      - name: Commit generated files to working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sea-cove/objects/
          if ! git diff --cached --quiet; then
            git commit -m 'Add original net rack, net bundle, and rope sprites'
            git push origin HEAD:feature/sea-cove-fishing-hamlet
          fi
