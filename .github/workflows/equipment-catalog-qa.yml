name: Current equipment availability QA
on:
  pull_request:
    paths:
      - 'src/game/equipment/current-availability.mjs'
      - 'data/maps/shiomachi-village/armory.mjs'
      - 'src/game/battle/rules.mjs'
      - 'previews/equipment-catalog/**'
      - 'tests/current-equipment-availability.test.mjs'
      - 'tools/qa-current-equipment-catalog.mjs'
      - '.github/workflows/equipment-catalog-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/game/equipment/current-availability.mjs'
      - 'data/maps/shiomachi-village/armory.mjs'
      - 'src/game/battle/rules.mjs'
      - 'previews/equipment-catalog/**'
      - 'tests/current-equipment-availability.test.mjs'
      - 'tools/qa-current-equipment-catalog.mjs'
      - '.github/workflows/equipment-catalog-qa.yml'
  workflow_dispatch:
jobs:
  equipment-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium dependency
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test equipment ledger against actual equipment definitions
        run: node --test tests/current-equipment-availability.test.mjs
      - name: Inspect equipment ledger on iPhone-sized browser
        run: node tools/qa-current-equipment-catalog.mjs
      - name: Upload iPhone-sized screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-catalog-screenshots
          path: artifacts/equipment-catalog-*.png
          if-no-files-found: warn
