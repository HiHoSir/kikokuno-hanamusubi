name: Field browser visual QA
on:
  push:
    branches: [main]
    paths:
      - 'src/field/**'
      - 'tools/qa-field-browser.mjs'
      - '.github/workflows/field-visual-qa.yml'
  workflow_dispatch:
jobs:
  field-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect actual field rendering in Chromium
        run: node tools/qa-field-browser.mjs
      - name: Upload portrait and landscape screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-chrome-screenshots
          path: artifacts/field-*.png
          if-no-files-found: warn
