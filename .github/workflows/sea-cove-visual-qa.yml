name: Sea Cove browser QA
on:
  pull_request:
    paths:
      - 'data/maps/sea-cove/**'
      - 'src/game/cove/**'
      - 'tools/qa-sea-cove-browser.mjs'
      - '.github/workflows/sea-cove-visual-qa.yml'
  push:
    branches: [main]
    paths:
      - 'data/maps/sea-cove/**'
      - 'src/game/cove/**'
      - 'src/field/walk.mjs'
      - 'src/game/navigation/**'
      - 'tools/qa-sea-cove-browser.mjs'
      - '.github/workflows/sea-cove-visual-qa.yml'
  workflow_dispatch:
jobs:
  cove-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser testing
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Render production cove and test sea animation and movement
        run: node tools/qa-sea-cove-browser.mjs
      - name: Preserve real canvas screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sea-cove-chromium-screenshots
          path: artifacts/sea-cove-*.png
          if-no-files-found: warn
