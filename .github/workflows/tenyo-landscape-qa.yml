name: Tenyo sanctuary landscape QA
on:
  push:
    branches: [main]
    paths:
      - 'src/game/tenyo/**'
      - 'src/game/ui/controls.css'
      - 'src/game/ui/landscape-only.css'
      - 'src/game/ui/landscape-only.mjs'
      - 'tools/qa-tenyo-landscape.mjs'
      - '.github/workflows/tenyo-landscape-qa.yml'
  workflow_dispatch:
jobs:
  tenyo-landscape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Validate real shrine landscape rendering and rotation
        run: node tools/qa-tenyo-landscape.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenyo-landscape-screenshots
          path: artifacts/tenyo-*.png
          if-no-files-found: warn
