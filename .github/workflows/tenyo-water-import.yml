name: One-time import of approved Tenyo water sanctuary
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tenyo-water-import.yml']
permissions:
  contents: write
jobs:
  import-sanctuary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace incorrect scene art with approved water sanctuary assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          entries=json.loads("[[\"stepping-stone\",\"assets/settlement-editor/pack-v1/stepping_stone.png\"],[\"tenyo-water-gate\",\"assets/settlement-editor/tenyo-gate-v1/tenyo_gate_6x4_v3.png\"],[\"torii-gate-v2\",\"assets/settlement-editor/tenyo-gate-v1/torii_gate_v2_4x3.png\"],[\"tenyo-stone-lantern\",\"assets/settlement-editor/tenyo-gate-v1/stone_lantern_1x2.png\"],[\"rock-island-lantern-base\",\"assets/settlement-editor/rock-island-v1/stone-island-96x64.png\"],[\"rock-island-lantern-base-mirror\",\"assets/settlement-editor/rock-island-v1/stone-island-mirror-96x64.png\"],[\"sanctuary-forest-frame-v3\",\"assets/settlement-editor/sanctuary-frame-v1/forest-frame.png\"],[\"sanctuary-horizon-v1\",\"assets/settlement-editor/sanctuary-horizon-v1/horizon.png\"],[\"sanctuary-fall-v2\",\"assets/settlement-editor/sanctuary-horizon-v1/waterfall.png\"],[\"tenyo-ripple-fx\",\"assets/settlement-editor/tenyo-water-v1/shallow_ripple_32x4.png\"],[\"tenyo-lotus-1\",\"assets/settlement-editor/tenyo-water-v1/lotus_leaf_1.png\"],[\"tenyo-lotus-2\",\"assets/settlement-editor/tenyo-water-v1/lotus_leaf_2.png\"],[\"tenyo-lotus-3\",\"assets/settlement-editor/tenyo-water-v1/lotus_leaf_3.png\"],[\"clear-water-shallow\",\"assets/settlement-editor/clear-water-v1/shallow.png\"],[\"clear-water-mid\",\"assets/settlement-editor/clear-water-v1/mid.png\"],[\"clear-water-deep\",\"assets/settlement-editor/clear-water-v1/deep.png\"],[\"clear-water-shore-deep-mid-n\",\"assets/settlement-editor/clear-water-v1/shore_deep_mid_N.png\"],[\"clear-water-shore-deep-mid-e\",\"assets/settlement-editor/clear-water-v1/shore_deep_mid_E.png\"],[\"clear-water-shore-deep-mid-s\",\"assets/settlement-editor/clear-water-v1/shore_deep_mid_S.png\"],[\"clear-water-shore-deep-mid-w\",\"assets/settlement-editor/clear-water-v1/shore_deep_mid_W.png\"],[\"clear-water-shore-mid-shallow-n\",\"assets/settlement-editor/clear-water-v1/shore_mid_shallow_N.png\"],[\"clear-water-shore-mid-shallow-e\",\"assets/settlement-editor/clear-water-v1/shore_mid_shallow_E.png\"],[\"clear-water-shore-mid-shallow-s\",\"assets/settlement-editor/clear-water-v1/shore_mid_shallow_S.png\"],[\"clear-water-shore-mid-shallow-w\",\"assets/settlement-editor/clear-water-v1/shore_mid_shallow_W.png\"],[\"waterfall-loop\",\"assets/settlement-editor/sanctuary-audio-v1/waterfall-loop.m4a\"]]")
          root="https://raw.githubusercontent.com/HiHoSir/yaksha-hanamusubi/26136fef4e73bcea60a73edf4e02cd252b3976d0/"
          manifest=Path("assets/manifest.json")
          obj=json.loads(manifest.read_text())
          obj["assets"]=[a for a in obj["assets"] if a["id"] not in {"tenyo-background","tenyo-shrine","tenyo-torii","tenyo-forest"}]
          for slug,source in entries:
              ext=".m4a" if slug=="waterfall-loop" else ".png"
              target=Path("assets/tenyo")/(slug+ext)
              subprocess.run(["curl","--fail","--location","--retry","3","--silent","--show-error",root+source,"-o",str(target)],check=True)
              assert target.stat().st_size>0,source
              obj["assets"].append({"id":"tenyo-"+slug,"type":"audio" if ext==".m4a" else ("effect" if slug.startswith("clear-water") or slug=="tenyo-ripple-fx" else "object"),"path":str(target),"status":"approved","origin":{"repo":"HiHoSir/yaksha-hanamusubi","commit":"26136fef4e73bcea60a73edf4e02cd252b3976d0","path":source},"usage":"tenyo-water-sanctuary-production"})
          manifest.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\\n")
          
          PY
          git rm assets/tenyo/background.webp assets/tenyo/forest.webp assets/tenyo/shrine.webp assets/tenyo/torii.webp
          git rm .github/workflows/tenyo-water-import.yml
          git add assets/tenyo assets/manifest.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Replace unrelated Tenyo art with approved animated water sanctuary assets'
          git push origin HEAD:main
