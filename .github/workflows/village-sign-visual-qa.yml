name: Village storefront signage browser QA
on:
  push:
    branches: [main]
    paths:
      - 'data/maps/hozuki-village/scene.json'
      - 'assets/village/scene/sign-*.png'
      - 'src/game/village/**'
      - 'src/game/interiors/**'
      - 'tools/qa-village-shop-signs.mjs'
      - '.github/workflows/village-sign-visual-qa.yml'
  workflow_dispatch:
jobs:
  village-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA without adding production dependencies
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Inspect storefront signs and door return paths at both orientations
        run: node tools/qa-village-shop-signs.mjs
      - name: Upload actual Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village-shop-sign-screenshots
          path: artifacts/village-*.png
          if-no-files-found: warn
