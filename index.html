<!doctype html>
<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鬼哭の花結び">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./src/game/app.webmanifest">
  <meta name="theme-color" content="#000000">
  <title>鬼哭の花結び</title>
  <link rel="stylesheet" href="./src/title/title.css?v=save-slots-1-rematch-1">
  <link rel="stylesheet" href="./src/game/ui/landscape-only.css?v=1">
  <script type="module" src="./src/game/ui/landscape-only.mjs?v=1"></script>
  <script type="module" src="./src/title/title.js?v=save-slots-1-shared-walk-1-owned-gear-2-shiomachi-gear-1-south-arrival-slash-1-shared-shops-1-cave-quest-1-ushiohei-hammer-1-finds-1-guardian-1-rematch-1-build-1"></script>
<link rel="stylesheet" href="./src/game/audio/audio.css">
<script type="module" src="./src/game/audio/boot.mjs"></script>
</head>
<body>
  <main class="title-screen" data-bgm="title">
    <div class="title-home">
      <h1 class="title-logo">
        <img src="./assets/ui/title/logo.webp" width="960" height="640" alt="鬼哭の花結び">
      </h1>
      <nav class="title-menu" aria-label="タイトルメニュー">
        <a class="title-start" href="./src/opening/?build=save-slots-1-sea-cove-1-shared-walk-1-owned-gear-2-shiomachi-gear-1-south-arrival-slash-1-shared-shops-1-cave-quest-1-ushiohei-hammer-1-stairs-stone-1-side-2-large-enemy-1-cave-return-1-battle-scale-1-inn-stay-1"><span>はじめから</span></a>
        <button type="button" id="title-continue" disabled><span>つづきから</span></button>
        <button type="button" id="show-demo"><span>デモを見る</span></button>
      </nav>
      <section id="title-load" class="title-load" aria-label="記録を読み込む" hidden>
        <h2>つづきから</h2>
        <div id="title-load-slots" class="title-load-slots"></div>
        <p id="title-load-message" role="status" aria-live="polite"></p>
        <button id="title-load-back" type="button">もどる</button>
      </section>
    </div>
    <section class="title-demo" aria-label="デモ" hidden>
      <img id="demo-image" alt="">
      <footer>
        <p id="demo-name" aria-live="polite"></p>
        <div class="demo-actions">
          <button type="button" id="next-scene">次の風景</button>
          <button type="button" id="close-demo">タイトルへ</button>
        </div>
      </footer>
    </section>
  <button id="sound-toggle" type="button" aria-label="サウンドを再生" aria-pressed="false">♪ 再生</button>
</main>
<aside id="landscape-required" class="landscape-required" role="status" aria-live="polite" aria-hidden="true">
  <span class="landscape-required-icon" aria-hidden="true">▯</span>
  <strong>横画面でプレイしてください</strong>
  <p>端末を横向きにすると、そのまま遊べます。</p>
</aside>
</body>
</html>
