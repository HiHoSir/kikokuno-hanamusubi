<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鬼哭の花結び">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./src/game/app.webmanifest">
  <meta name="theme-color" content="#000000">
  <title>鬼哭の花結び</title>
  <link rel="stylesheet" href="./src/title/title.css?v=dotgothic16">
  <script type="module" src="./src/title/title.js"></script>
</head>
<body>
  <main class="title-screen">
    <div class="title-home">
      <h1 class="title-logo">
        <img src="./assets/ui/title/logo.webp" width="960" height="640" alt="鬼哭の花結び">
      </h1>
      <nav class="title-menu" aria-label="タイトルメニュー">
        <a class="title-start" href="./src/opening/"><span>はじめから</span></a>
        <button type="button" disabled><span>つづきから</span></button>
        <button type="button" id="show-demo"><span>デモを見る</span></button>
      </nav>
    </div>
    <section class="title-demo" aria-label="デモ" hidden>
      <img id="demo-image" alt="">
      <footer>
        <p id="demo-name" aria-live="polite"></p>
        <div class="demo-actions">
          <button type="button" id="next-scene">次の風景</button>
          <button type="button" id="close-demo">タイトルへ</button>
        </div>
      </footer>
    </section>
  </main>
</body>
</html>
