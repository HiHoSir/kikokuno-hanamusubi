const screen=document.getElementById('screen'),c=screen.getContext('2d'),status=document.getElementById('stat');c.imageSmoothingEnabled=false;
const background=document.createElement('canvas');background.width=W*T;background.height=H*T;const bg=background.getContext('2d');bg.imageSmoothingEnabled=false;
const p={x:9.5*T,y:9.2*T,face:0,phase:0,distance:0,blocks:0};let last=0,ticks=0,atlasReady=false,hizukiReady=false,hold=new Set(),drag=null;
const DIR={up:[0,-1,1],down:[0,1,0],left:[-1,0,3],right:[1,0,2]},KEY={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};
const isFloor=(x,y)=>x>=0&&x<W&&y>=0&&y<H&&GRID[y][x]==='.';
const inFloor=(x,y)=>isFloor(Math.floor(x/T),Math.floor(y/T));
function canMove(x,y){return [[-10,-6],[10,-6],[-10,4],[10,4]].every(([ox,oy])=>inFloor(x+ox,y+oy));}
function distField(){let d=GRID.map(row=>[...row].map(c=>c==='.'?0:999));let q=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[y][x]===0)q.push([x,y]);for(let i=0;i<q.length;i++){const [x,y]=q[i];for(let [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]){let xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<W&&yy<H&&d[yy][xx]>d[y][x]+1){d[yy][xx]=d[y][x]+1;q.push([xx,yy]);}}}return d;}
const dist=distField();
function mask(x,y){return (isFloor(x,y-1)?1:0)|(isFloor(x+1,y)?2:0)|(isFloor(x,y+1)?4:0)|(isFloor(x-1,y)?8:0);}
function secondary(x,y){if(isFloor(x,y+2))return 'north_face';if(isFloor(x,y-2))return 'south_face';if(isFloor(x-2,y))return 'east_face';if(isFloor(x+2,y))return 'west_face';return null;}
function tile(n,x,y){const pos=INDEX[n];if(!pos)throw new Error('Missing atlas tile '+n);bg.drawImage(atlas,pos[0],pos[1],48,48,x*T,y*T,48,48);}
function rebuild(){bg.clearRect(0,0,background.width,background.height);bg.fillStyle='#0a0e16';bg.fillRect(0,0,background.width,background.height);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(isFloor(x,y))tile(`floor_${x%4}_${y%4}`,x,y);else if(dist[y][x]<=2)tile(`rock_${x%4}_${y%4}`,x,y);}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(isFloor(x,y)||dist[y][x]>2)continue;const v=(x+3*y)%4,m=mask(x,y);if(m)tile(`edge_mask_${String(m).padStart(2,'0')}_v${v}`,x,y);else if(dist[y][x]===2){const r=secondary(x,y);if(r){tile(`${r}_v${v}`,x,y);if(r==='north_face')tile(`roof_v${v}`,x,y);}}}
}
function step(d,dt){const [dx,dy,f]=DIR[d];p.face=f;const speed=148*dt,slices=Math.max(1,Math.ceil(speed/5));let moved=0;for(let i=0;i<slices;i++){const nx=p.x+dx*speed/slices,ny=p.y+dy*speed/slices;if(canMove(nx,ny)){p.x=nx;p.y=ny;moved+=speed/slices}else{p.blocks++;break}}if(moved){p.distance+=moved;p.phase=Math.floor(p.distance/15)%3;}else p.phase=0;}
function draw(){c.fillStyle='#090d15';c.fillRect(0,0,screen.width,screen.height);

 else {c.fillStyle='#afc4db';c.fillRect(p.x-left-17,p.y-top-47,34,44);c.fillStyle='#f2d28d';c.font='12px sans-serif';c.fillText('緋月',p.x-left-13,p.y-top-58);}
 if(document.getElementById('grid').checked){c.beginPath();c.lineWidth=1;c.strokeStyle='rgba(255,207,105,.32)';for(let x=-left%T;x<=screen.width;x+=T){c.moveTo(x+.5,0);c.lineTo(x+.5,screen.height)}for(let y=-top%T;y<=screen.height;y+=T){c.moveTo(0,y+.5);c.lineTo(screen.width,y+.5)}c.stroke();}
 if(document.getElementById('collision').checked){c.fillStyle='rgba(229,86,73,.22)';for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!isFloor(x,y))c.fillRect(x*T-left,y*T-top,T,T);
 c.strokeStyle='#81eea0';c.lineWidth=2;c.strokeRect(p.x-left-10,p.y-top-6,20,10);c.fillStyle='#ebcf84';c.fillRect(p.x-left-2,p.y-top-2,4,4);}

}
function tick(now){const dt=Math.min(.05,last?(now-last)/1000:0);last=now;const dir=['up','down','left','right'].find(d=>hold.has(d));if(dir)step(dir,dt);else p.phase=0;draw();requestAnimationFrame(tick);}
window.addEventListener('keydown',e=>{const d=KEY[e.key];if(d){e.preventDefault();hold.add(d)}});window.addEventListener('keyup',e=>{const d=KEY[e.key];if(d){e.preventDefault();hold.delete(d)}});window.addEventListener('blur',()=>hold.clear());
for(const b of document.querySelectorAll('[data-dir]')){const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);hold.add(d);b.classList.add('pressed')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{hold.delete(d);b.classList.remove('pressed')});}
screen.addEventListener('pointerdown',e=>{e.preventDefault();screen.setPointerCapture(e.pointerId);drag=[e.clientX,e.clientY];});screen.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];hold.clear();if(Math.hypot(dx,dy)>17)hold.add(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));});for(const ev of ['pointerup','pointercancel','lostpointercapture'])screen.addEventListener(ev,()=>{drag=null;hold.clear()});

const targets={start:[9.5,9.2],back:[8.2,3.35],side:[3.4,5.5],corner:[9,8],island:[8.5,6.2],exit:[8.5,11.6]};
for(const b of document.querySelectorAll('[data-jump]'))b.addEventListener('click',()=>{const t=targets[b.dataset.jump],x=t[0]*T,y=t[1]*T;if(canMove(x,y)){p.x=x;p.y=y;p.face=1;p.distance=0;p.phase=0;hold.clear();draw();}else status.textContent='移動先が通行不可です（座標の調整が必要）';});
atlas.onload=()=>{atlasReady=true;rebuild();draw()};atlas.onerror=()=>{status.textContent='部品画像が読み込めません'};
hizuki.onload=()=>{hizukiReady=(hizuki.width===240&&hizuki.height===448);draw()};hizuki.onerror=()=>{status.textContent='緋月画像の読込に失敗。タイルと通行の検査は続けられます。'};
