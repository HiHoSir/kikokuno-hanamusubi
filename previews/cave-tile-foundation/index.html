function tick(now){const dt=Math.min(.05,last?(now-last)/1000:0);last=now;const dir=['up','down','left','right'].find(d=>hold.has(d));if(dir)step(dir,dt);else p.phase=0;draw();requestAnimationFrame(tick);}
window.addEventListener('keydown',e=>{const d=KEY[e.key];if(d){e.preventDefault();hold.add(d)}});window.addEventListener('keyup',e=>{const d=KEY[e.key];if(d){e.preventDefault();hold.delete(d)}});window.addEventListener('blur',()=>hold.clear());
for(const b of document.querySelectorAll('[data-dir]')){const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);hold.add(d);b.classList.add('pressed')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{hold.delete(d);b.classList.remove('pressed')});}
screen.addEventListener('pointerdown',e=>{e.preventDefault();screen.setPointerCapture(e.pointerId);drag=[e.clientX,e.clientY];});screen.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];hold.clear();if(Math.hypot(dx,dy)>17)hold.add(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));});for(const ev of ['pointerup','pointercancel','lostpointercapture'])screen.addEventListener(ev,()=>{drag=null;hold.clear()});
document.getElementById('pad').addEventListener('contextmenu',e=>e.preventDefault());screen.addEventListener('contextmenu',e=>e.preventDefault());
const targets={start:[9.5,9.2],back:[8.2,3.35],side:[3.4,5.5],corner:[9,8],island:[8.5,6.2],exit:[8.5,11.6]};
for(const b of document.querySelectorAll('[data-jump]'))b.addEventListener('click',()=>{const t=targets[b.dataset.jump],x=t[0]*T,y=t[1]*T;if(canMove(x,y)){p.x=x;p.y=y;p.face=1;p.distance=0;p.phase=0;hold.clear();draw();}else status.textContent='移動先が通行不可です（座標の調整が必要）';});
atlas.onload=()=>{atlasReady=true;rebuild();draw()};atlas.onerror=()=>{status.textContent='部品画像が読み込めません'};
hizuki.onload=()=>{hizukiReady=(hizuki.width===240&&hizuki.height===448);draw()};hizuki.onerror=()=>{status.textContent='緋月画像の読込に失敗。タイルと通行の検査は続けられます。'};
requestAnimationFrame(tick);
</script></body></html>
