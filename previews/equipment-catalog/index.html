<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>装備品の現行台帳 | 鬼哭の花結び</title>
<style>
:root{font-family:ui-monospace,Menlo,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#ebeddc;background:#111b23}
*{box-sizing:border-box}
body{margin:0;padding:max(18px,env(safe-area-inset-top)) max(15px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(15px,env(safe-area-inset-left));line-height:1.55}
main{max-width:1050px;margin:auto}
header{border-bottom:1px solid #607167;padding-bottom:12px}
h1{font-size:clamp(19px,3.2vw,28px);margin:.2em 0}
h2{font-size:18px;margin:2px 0}
p{margin:7px 0}
small,.small{font-size:12px;color:#b3bbaf}
a{color:#bde6b5}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.stat{padding:9px 12px;border:1px solid #52665f;background:#1c2b31;border-radius:5px;font-size:13px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:13px;margin:18px 0}
article{border:1px solid #4a5b5b;border-radius:7px;padding:14px;background:#18252e}
article[data-state=preview-only]{border-color:#a18d5c}
article[data-state=no-equipment]{opacity:.82}
.status{display:inline-block;font-size:11px;color:#ebeddc;background:#354e54;border:1px solid #71807a;padding:2px 7px;border-radius:4px}
article[data-state=preview-only] .status{background:#5c4c34}
table{border-collapse:collapse;width:100%;font-size:13px;margin:9px 0}
th,td{padding:7px 4px;text-align:left;border-bottom:1px solid #40535a}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:#c4e0ce;font-weight:600}
.note{color:#d3d4c3;font-size:12px;margin-top:10px}
.problem{border-left:3px solid #c0a06b;padding:8px 12px;background:#2a2b2a;margin:14px 0}
.block{padding:13px 15px;background:#18252e;border:1px solid #4a5b5b;border-radius:7px;margin:14px 0}
footer{border-top:1px solid #495c60;padding-top:14px;margin-top:23px;font-size:12px;color:#adb4ab}
@media(max-width:420px){td,th{padding:6px 2px;font-size:12px}article{padding:10px}.stat{font-size:12px}}
</style>
</head>
<body>
<main>
<header>
<p class="small">『鬼哭の花結び』／現行実装の点検ページ・読み取り専用</p>
<h1>いま存在する地域の装備品</h1>
<p class="small">ゲーム中の装備定義から直接一覧化。試作品・未実装の装備を正式な販売品に混ぜません。セーブや所持品は変更しません。</p>
</header>
<div class="stats" id="counts"></div>
<section class="areas" id="areas" aria-label="地域別装備一覧"></section>
<section class="block" aria-labelledby="progression-heading">
<h2 id="progression-heading">確定済みのT0〜T6補正（販売品とは別）</h2>
<p class="small">以下は合計補正の確定設計値です。購入場所・配分・取得時期の承認ではありません。</p>
<table><thead><tr><th>段階</th><th class="num">攻撃合計</th><th class="num">守備合計</th><th>入手先</th></tr></thead><tbody id="tiers"></tbody></table>
</section>
<div id="discrepancy" class="problem" role="note"></div>
<footer>
<p>現時点：鬼灯村の装備は購入・装着・保存に対応。天妖の社と海の入り江に兵具の販売・拾得はありません。潮待村は単独プレビューに限ります。</p>
<p><a href="../../">ゲームに戻る</a> ／ <a href="../shiomachi-village/">潮待村の試作を見る</a></p>
</footer>
</main>
<script type="module">
import {EXISTING_EQUIPMENT_LOCATIONS,existingEquipmentAt,
 firstVillageTierMismatch,approvedTierBenchmarks} from '../../src/game/equipment/current-availability.mjs';
const label={'initial':'初期所持','in-game':'本編で購入可能','no-equipment':'装備の入手なし','preview-only':'試用のみ'};
function element(tag,value,className){
 const el=document.createElement(tag);if(value!==undefined)el.textContent=String(value);
 if(className)el.className=className;return el;
}
const areas=document.getElementById('areas');
for(const loc of EXISTING_EQUIPMENT_LOCATIONS){
 const site=existingEquipmentAt(loc.id);
 const card=element('article');card.dataset.state=loc.availability;
 card.dataset.location=loc.id;
 card.append(element('h2',loc.name),element('span',label[loc.availability],'status'));
 if(site.items.length){
  const table=element('table'),thead=element('thead'),header=element('tr');
  for(const [label,klass] of [['装備品',''],['部位',''],['性能','num'],['価格','num']])
   header.append(element('th',label,klass));
  thead.append(header);table.append(thead);
  const body=element('tbody');
  for(const item of site.items){
   const row=element('tr');row.dataset.itemId=item.id;
   row.append(element('td',item.name),element('td',{'weapon':'武器','body':'胴','head':'頭','feet':'足'}[item.slot]),
    element('td',item.attack?'攻+'+item.attack:item.defense?'守+'+item.defense:'補正なし','num'),
    element('td',item.price===null?'非売品':item.price+'両','num'));
   body.append(row);
  }
  table.append(body);card.append(table);
 }else card.append(element('p','現在、入手できる兵具はありません。','small'));
 card.append(element('p',loc.note,'note'));areas.append(card);
}
const shop=existingEquipmentAt('hozuki-village'),demo=existingEquipmentAt('shiomachi-village');
for(const value of [
 '本編の販売品 '+shop.items.length+'点',
 '本編で装備できる品 '+(shop.items.length+existingEquipmentAt('start').items.length)+'点',
 '独立試作品 '+demo.items.length+'点'
])document.getElementById('counts').append(element('span',value,'stat'));
for(const tier of approvedTierBenchmarks()){
 const tr=element('tr');
 tr.dataset.tier=tier.id;
 for(const [v,c] of [[tier.id,''],['+'+tier.attack,'num'],['+'+tier.defense,'num'],['未確定','']])
  tr.append(element('td',v,c));
 document.getElementById('tiers').append(tr);
}
const mismatch=firstVillageTierMismatch();
document.getElementById('discrepancy').textContent=
 '未解決：鬼灯村の販売4点を全部装備した場合は攻+'+mismatch.actualShop.attack+
 '／守+'+mismatch.actualShop.defense+'、一方で当初T1の確定合計補正は攻+'+
 mismatch.approvedT1.attack+'／守+'+mismatch.approvedT1.defense+
 '。一致しません。どちらかの数値を勝手に直したり重ね掛けしたりせず、別々に保護しています。';
</script>
</body>
</html>
