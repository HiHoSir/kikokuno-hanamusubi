<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>フィールド探索・Pages検査</title>
<style>html,body{margin:0;background:#19251e;color:#fff2db;font-family:system-ui,sans-serif}body{padding:20px}</style></head>
<body><p id="progress">GitHub Pagesから本編描画を読み込んでいます…</p>
<script type="module">
const area=new URL("../../src/field/index.html",location.href);
const query=new URLSearchParams(location.search);
const playUrl=new URL(location.href);
if(query.get("from")!=="battle"){playUrl.searchParams.set("from","battle");location.replace(playUrl.href);}
else try{
const resp=await fetch(area,{cache:"no-store"});
if(!resp.ok)throw Error("フィールドのHTMLを取得できません: "+resp.status);
let source=await resp.text();
const gate='<script src="../game/navigation/entry.js" data-entry="game"></scr'+'ipt>';
const slot='<script src="../../data/maps/field/terrain.js?v=authored-waterfall-1"></scr'+'ipt>';
if(!source.includes(gate)||!source.includes(slot))throw Error("本編フィールドの読み込み構成が変化しました");
const tag=s=>'<scr'+'ipt>'+s+'</scr'+'ipt>';
const base='<base href="'+area.href+'">';
source=source.replace('<head>','<head>'+base)
  .replace(gate,tag("(()=>{\nconst points={meadow:[27,59],approach:[40,65],west:[34,60],east:[46,61],lookout:[40,59],rear:[40,58],eastHighland:[63,34],centralHighland:[24,38],northRidge:[68,26],forestCliff:[39,32],mountainCliff:[54,22],treeEdgeEast:[60,29],treeEdgeCenter:[30,39]};\nconst at=new URLSearchParams(location.search).get('start')||'meadow';\nconst [x,y]=points[at]||points.meadow;\nwindow.__FIELD_EXPLORATION_REQUESTED_CELL=[x,y];\ntry{sessionStorage.setItem('kikokuno-hanamusubi-battle-field-return',JSON.stringify({x:x*32+16,y:y*32+16,row:1}));}\ncatch(e){console.error('試験用位置を保存できません',e);}\nwindow.KIKOKU_ROUTE={go(target){alert('検査画面です。通常のゲームへの遷移は無効です。');}};\nwindow.addEventListener('pagehide',()=>{try{sessionStorage.removeItem('kikokuno-hanamusubi-battle-field-return');}catch{}});\n})();"));
source=source.replace(slot,slot+tag("window.__FIELD_EXPLORATION_PREVIEW={source:'production',tiles:61,heights:71,added:27,removed:18,thinnedMountains:0,restoredMountains:16,phase:'production-field-exploration'};"));
const walkSlot='<script type="module" src="./walk.mjs?v=authored-waterfall-1"></scr'+'ipt>';
const walkResponse=await fetch(new URL('walk.mjs',area),{cache:'no-store'});
if(!walkResponse.ok||!source.includes(walkSlot))throw Error('歩行モジュールの読み込み構成が変わりました');
let walkCode=await walkResponse.text();
const encounterLine='const encounterAfter=9+Math.floor(Math.random()*5);';
if(!walkCode.includes(encounterLine))throw Error('歩行処理が変更されているため検査を停止します');
walkCode=walkCode.replace(encounterLine,'const encounterAfter=Number.POSITIVE_INFINITY;');
// The chosen inspection tile can itself be a tree/collision cell. Keep the
// requested camera target, but spawn the playable hero on nearby reachable land
// instead of silently falling back to the village on failed battle return.
const inspectionSpawn="(()=>{const world=window.YK_WORLD;const requested=window.__FIELD_EXPLORATION_REQUESTED_CELL;\n"+
" if(!world||!requested)throw Error('レビュー位置を決定できません');\n"+
" const wanted=requested.map(n=>n*32+16);let actual=world.safePosition(wanted);\n"+
" const isOpen=p=>world.walkable(...p)&&!window.YK_AREA_TRANSITIONS.contact(world,...p)&&"+
"world.mapData.travelReachable.has(Math.floor(p[0]/32)+','+Math.floor(p[1]/32));\n"+
" if(!isOpen(actual)){outer:for(let r=0;r<80;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){"+
"if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const p=[wanted[0]+dx*32,wanted[1]+dy*32];"+
"if(isOpen(p)){actual=p;break outer;}}}\n"+
" const resolved=actual.map(n=>Math.floor(n/32));\n"+
" window.__FIELD_EXPLORATION_SPAWN={requested,resolved,displacement:Math.max(Math.abs(resolved[0]-requested[0]),Math.abs(resolved[1]-requested[1]))};\n"+
" sessionStorage.setItem('kikokuno-hanamusubi-battle-field-return',JSON.stringify({x:actual[0],y:actual[1],row:1}));\n"+
"})();";
source=source.replace(walkSlot,tag(inspectionSpawn)+'<script type="module">'+walkCode+'</scr'+'ipt>');
const reviewRoot=new URL("./",location.href);
const navigation='<nav id="review-controls" aria-label="検査場所の選択">'
 + ['meadow','approach','west','east','lookout','rear','eastHighland','centralHighland','northRidge','forestCliff','mountainCliff','treeEdgeEast','treeEdgeCenter'].map((p,i)=>'<a href="'+new URL("?from=battle&start="+p,reviewRoot).href+'">'+['森の寄り道','南の坂','西の坂','東の坂','高台の上','北の踏み跡','東の高台','中央の高台','北東の眺め','森と斜め崖','山と斜め崖','東の斜め崖','中央の斜め崖'][i]+'</a>').join('')
 + '</nav>';
const instructions='<aside id="field-climb-help">斜め崖周辺の木を間引き、山の画像と衝突判定を揃えた検査版</aside>';
source=source.replace('</head>', '<style>\n'
 + '#review-controls{position:fixed;z-index:100;top:max(7px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:5px;padding:4px;background:#13212ae6;border:1px solid #e4d4aa;max-width:85vw;flex-wrap:wrap} '
 + '#review-controls a{display:block;color:#fff6df;font:11px system-ui;padding:5px 7px;border:1px solid #a6a28b;border-radius:4px;text-decoration:none;white-space:nowrap} '
 + '#review-controls a:active{background:#66725f} #field-climb-help{position:fixed;z-index:90;top:max(8px,env(safe-area-inset-top));left:42%;padding:5px 10px;background:#13212add;border:1px solid #a9a58b;color:#fff3d5;font:11px system-ui;pointer-events:none;white-space:nowrap} '
 + '</style></head>').replace('</body>',navigation+instructions+'</body>');
document.open();document.write(source);document.close();
}catch(err){document.querySelector('#progress').textContent="検査ページを開けません："+err.message;console.error(err);}
</script></body></html>
