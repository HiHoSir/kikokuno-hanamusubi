<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>鬼哭の花結び｜フィールド描画方式比較</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121e24;color:#f5ead4;font-family:system-ui,sans-serif}
main{width:100%;height:100dvh;display:flex;flex-direction:column;min-height:0}
header{height:50px;flex:0 0 auto;padding:5px max(8px,env(safe-area-inset-right)) 5px max(8px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;background:#14242d}
header strong{font-size:12px;white-space:nowrap}button{min-height:38px;min-width:95px;border:1px solid #c4a77c;border-radius:7px;background:#263948;color:#f4e4bd;font-size:12px;font-weight:700}
button[aria-pressed=true]{background:#ba9054;color:#142029}#info{font-size:11px;opacity:.9;flex:1;text-align:right;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
iframe{display:block;border:0;width:100%;flex:1;min-height:0;background:#102635}
#rotate{display:none;position:absolute;inset:0;background:#10202a;z-index:10;align-items:center;justify-content:center;text-align:center;padding:2rem;font-size:18px}
@media (orientation:portrait){#rotate{display:flex}}
@media (max-width:660px){header strong{display:none}button{min-width:90px}}
</style>
</head>
<body>
<main>
<header>
<strong>描画方式の比較</strong>
<button id="current" aria-pressed="true">従来カメラ</button>
<button id="tiles" aria-pressed="false">透過チップ＋動く海</button>
<output id="info" role="status">読み込み中</output>
</header>
<iframe id="game" title="鬼哭の花結び フィールド比較" allow="autoplay"></iframe>
</main>
<div id="rotate">横画面に回転して比較してください</div>
<script>
(()=>{
 const frame=document.querySelector('#game'),msg=document.querySelector('#info');
 const current=document.querySelector('#current'),tiles=document.querySelector('#tiles');
 let selection='current',ready=false;
 const root=new URL('../',location.href);
 function target(){const q=selection==='tiles'?'&renderer=tile-layers':'';return new URL('src/field/?from=village&profile=1'+q,root).href}
 function open(){
  if(!ready)return;
  try{frame.contentWindow.KIKOKU_GAME.navigate(target());msg.textContent='描画中…';}
  catch(e){msg.textContent='切替失敗: '+e.message}
 }
 function select(mode){
  if(mode===selection)return;
  selection=mode;current.setAttribute('aria-pressed',String(mode==='current'));
  tiles.setAttribute('aria-pressed',String(mode==='tiles'));open();
 }
 current.addEventListener('click',()=>select('current'));tiles.addEventListener('click',()=>select('tiles'));
 const shellUrl=new URL('src/game/',root);
 sessionStorage.setItem('kikokuno-hanamusubi-next-entry',JSON.stringify({
  route:shellUrl.pathname,expiresAt:Date.now()+120000
 }));
 frame.addEventListener('load',()=>{ready=!!frame.contentWindow.KIKOKU_GAME;open();},{once:true});
 frame.src=shellUrl.href;
 let prev='';
 const update=()=>{
  if(!ready)return;
  try{
   const world=frame.contentDocument.querySelector('#game-scene').contentWindow;
   const metric=world.__FIELD_RENDER_PROFILE;
   const trial=world.__FIELD_TILE_LAYER_TRIAL?.info;
   if(trial?.builds)msg.textContent='地形生成 '+trial.buildMs+'ms / 水面2コマ';
   else if(metric?.frames)msg.textContent='従来描画 '+(metric.totalMs/metric.frames).toFixed(1)+'ms';
  }catch{}
 };
 window.addEventListener('focus',update);
 // Lightweight UI update only; actual scene playback and BGM belong to the shell.
 setInterval(update,1000);
})();
</script>
</body></html>
