<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- Review-only: bypass title return guard; this page is not a game entry point. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鬼哭の花結び">
<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#142c38">
<title>海の入り江・動作確認（GitHub Pages）｜鬼哭の花結び</title>
<style>
:root{color-scheme:dark;background:#142c38;color:#f7efdb;font:16px system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;overscroll-behavior:none}
main{width:min(100%,880px);height:100vh;height:100dvh;margin:auto;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px}
h1{font-size:17px;line-height:1.25;margin:0}
.viewport{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #73785c;border-radius:8px;background:#284d4b}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
.controls{display:flex;align-items:center;justify-content:center;gap:8px}
.dpad{display:grid;grid-template-columns:repeat(3,47px);grid-template-rows:repeat(2,42px);gap:3px}
button{border:1px solid #777d62;border-radius:8px;background:#314337;color:inherit;font:inherit;min-height:40px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
button:active,button.held,button[aria-pressed=true]{background:#e8cc8b;color:#272d22}
.dpad button{font-size:19px}
[data-dir=up]{grid-column:2}
[data-dir=left]{grid-column:1;grid-row:2}
[data-dir=down]{grid-column:2;grid-row:2}
[data-dir=right]{grid-column:3;grid-row:2}


#load{position:absolute;inset:0;display:grid;place-items:center;margin:0;background:#284d4b;text-align:center;padding:10px}
#load[hidden]{display:none}
@media(orientation:landscape) and (max-height:520px){
 main{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
 .controls{flex-direction:column;justify-content:center}
}
.screen-reader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.village-hud{position:absolute;z-index:2;top:8px;left:8px;max-width:min(80%,340px);padding:7px 11px;border:1px solid #81785c;border-radius:5px;background:rgba(18,25,20,.83);display:grid;gap:3px;pointer-events:none;font-size:12px}
.village-hud[hidden],.village-hud p:empty{display:none}
.village-hud #shell-notice{margin:0;font-size:12px;line-height:1.4;color:#f1ead9}
.village-hud #shell-hint{margin:0;font-size:11px;line-height:1.35;color:#e9ce95}
.review-shortcuts{position:absolute;top:7px;right:7px;z-index:4;display:flex;gap:4px;max-width:60%;flex-wrap:wrap;justify-content:flex-end}
.review-shortcuts button{padding:4px 7px;min-height:27px;border-radius:4px;font-size:11px;white-space:nowrap;background:#273c39e8}
.viewport .village-hud{max-width:min(45%,255px)}
@media(max-width:600px){.review-shortcuts{gap:2px}.review-shortcuts button{padding:3px 5px;font-size:10px}}
</style>
<link rel="stylesheet" href="../../src/game/village/dialogue.css?v=dotgothic16">
<link rel="stylesheet" href="../../src/game/ui/controls.css?v=dotgothic16">
<script type="module" src="../../src/game/ui/selection-guard.mjs"></script>
<link rel="stylesheet" href="../../src/game/audio/audio.css">

<script src="../../src/field/assets.js"></script>
<script src="../../src/field/landscape.js"></script>
<script src="../../src/field/autotile.js"></script>
</head>
<body>
<main data-bgm="field">
<h1 class="screen-reader">海の入り江</h1>
<section class="viewport" aria-label="海の入り江">
<div class="village-hud" hidden><p id="shell-notice" aria-live="polite"></p><p id="shell-hint" aria-live="polite"></p></div>
<nav class="review-shortcuts" aria-label="外観検査の移動先">
 <button type="button" data-review-spot="shore" aria-label="波打ち際で検査">波打ち際</button>
 <button type="button" data-review-spot="rocks" aria-label="岩場で緋月との大きさを比較">岩場</button>
 <button type="button" data-review-spot="worksite" aria-label="漁師小屋と漁具の大きさを比較">漁師小屋</button>
 <button type="button" data-review-spot="south" aria-label="南口で検査">南口</button>
</nav>
<canvas id="scene"></canvas><p id="load">海の入り江を読み込んでいます</p>
<button id="talk" type="button" hidden>話す</button>
<section id="dialogue" aria-labelledby="speaker" hidden>
  <div class="dialog-window" role="dialog" aria-modal="false">
    <strong id="speaker"></strong>
    <p id="line"></p>
    <button id="next" type="button" aria-label="次のセリフへ">▼</button>
  </div>
</section>
</section>
<section id="pad" class="controls" aria-label="ゲーム操作">
  <div class="dpad" aria-label="十字キー・4方向移動" role="group">
    <button id="up" type="button" data-dir="up" aria-label="上">▲</button>
    <button id="left" type="button" data-dir="left" aria-label="左">◀</button>
    <button id="right" type="button" data-dir="right" aria-label="右">▶</button>
    <button id="down" type="button" data-dir="down" aria-label="下">▼</button>
  </div>
  <button id="action-b" class="round sub" type="button" aria-label="B 戻る">B<small>戻る</small></button>
  <button id="action-a" class="round main" type="button" aria-label="A 決定・話す・調べる">A<small>決定</small></button>
</section>

</main>
<script type="module" src="../../src/game/cove/walk.mjs?cove-review=1&v=coastal-hamlet-1-world-scale-1-native-objects-1-rocks-1-gear-art-1-south-gate-1-shared-walk-1-shiomachi-gear-1-south-arrival-1-cave-quest-1"></script>
</body>
</html>
