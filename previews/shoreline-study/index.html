<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#153147">
<title>海辺32px接続・歩行検査｜鬼哭の花結び</title>
<style>
:root{color-scheme:dark;background:#152b3d;color:#f6f1e4;font:13px "Hiragino Kaku Gothic ProN",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
main{position:fixed;inset:0;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#heading{position:absolute;top:max(7px,env(safe-area-inset-top));left:max(9px,env(safe-area-inset-left));background:#142432dd;border:1px solid #c9b185aa;padding:7px 10px;pointer-events:none;max-width:65%;font-size:14px}
#heading small{display:block;font-size:10px;margin-top:3px;color:#d8d8c8}
#controls{position:absolute;bottom:calc(7px + env(safe-area-inset-bottom));left:max(9px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(3,47px);grid-template-rows:repeat(2,47px);gap:3px}
button{color:#faf2de;background:#243a4cdd;border:1px solid #c8b38e;border-radius:6px;cursor:pointer;min-height:44px;font:16px system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#controls button:active,#controls button.held{background:#a28357;color:#102536}
[data-dir="up"]{grid-column:2;grid-row:1}
[data-dir="left"]{grid-column:1;grid-row:2}
[data-dir="down"]{grid-column:2;grid-row:2}
[data-dir="right"]{grid-column:3;grid-row:2}
#tools{position:absolute;right:max(9px,env(safe-area-inset-right));bottom:calc(9px + env(safe-area-inset-bottom));display:flex;gap:6px}
#tools button{font:12px system-ui,sans-serif;padding:6px 10px}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#162d39e8;color:#fbefcf;text-align:center;font-size:15px;z-index:3;padding:25px}
#loading[hidden]{display:none}
#rotate{display:none}
@media (orientation:portrait){#rotate{position:absolute;inset:0;background:#152b3df2;display:grid;place-items:center;z-index:4;text-align:center;padding:20px}}
</style>
<script src="../../src/field/assets.js"></script>
<script src="../../src/field/landscape.js"></script>
<script src="../../src/field/autotile.js"></script>
</head>
<body>
<main>
  <canvas id="scene" role="img" aria-label="32ピクセルの海・波打ち際・砂浜・草地を組み合わせた歩行検証"></canvas>
  <div id="heading">海辺の接続検証 <small>32pxアニメマップチップ（8コマ）／岩・草の縮尺検証／村用緋月／本編未採用</small></div>
  <div id="controls" aria-label="四方向移動">
    <button data-dir="up" aria-label="北">▲</button>
    <button data-dir="left" aria-label="西">◀</button>
    <button data-dir="down" aria-label="南">▼</button>
    <button data-dir="right" aria-label="東">▶</button>
  </div>
  <div id="tools">
    <button id="grid" type="button" aria-pressed="false">境界表示</button>
    <button id="reset" type="button">開始位置</button>
  </div>
  <div id="loading">既存の海岸チップと水面画像を読み込み中…</div>
  <div id="rotate">iPhoneを横向きにしてください</div>
</main>
<script type="module">
import {TILE,WIDTH,HEIGHT,MAP,START,SHORE_Y,SAND_DEPTH,SCENERY,canStandWithScenery,shoreCover,safeFoot,validateShore} from '../../data/maps/shoreline-study/scene.mjs';
import {TIDE_FRAMES,tideFrame,surfSample} from '../../data/maps/shoreline-study/tide.mjs';
import {drawCharacter} from '../../src/game/village/residents.mjs';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false});
const loading=document.querySelector('#loading');
const directions={up:[0,-1,1],down:[0,1,0],right:[1,0,2],left:[-1,0,3]};
const keyToDir={ArrowUp:'up',ArrowDown:'down',ArrowRight:'right',ArrowLeft:'left',w:'up',s:'down',d:'right',a:'left'};
const pressed=new Map(),buttons=[...document.querySelectorAll('[data-dir]')];
let hero={...START},stride=0,walking=false,lastTime=0,grid=false,draws=0;
const camera={x:0,y:0};
const buffer=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const q=c.getContext('2d');q.imageSmoothingEnabled=false;return [c,q];};
const image=(src)=>new Promise((resolve,reject)=>{
 const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('画像取得失敗: '+src));im.src=src;
});
const asset=path=>new URL('../../'+path,import.meta.url);
const initImage=async path=>image(asset(path).href);
const source={
 hero:'assets/characters/hizuki/walk-4dir-80x112.png',
 rock:'assets/village/objects/rocks.png',
 grassTuft:'assets/village/terrain/grass-tuft.png',
 water:'assets/field/effects/water-motion.png',
 mask:'assets/field/terrain/atlas/coast-mask-32.png',
 foam:'assets/field/terrain/atlas/coast-shallow-32.png',
 sand:['assets/field/terrain/atlas/coast-sand-0-32.png',
       'assets/field/terrain/atlas/coast-sand-1-32.png',
       'assets/field/terrain/atlas/coast-sand-2-32.png',
       'assets/field/terrain/atlas/coast-sand-3-32.png']
};
// Existing approved tuft is a saturated village accent. Keep every alpha
// pixel and its native 32x32 outline, but match this *preview's* grass
// material palette so independent sprites do not look fluorescent.
// This is a reversible runtime comparison, not a change to approved PNGs.
function grassPaletteSprite(source){
 const [canvas,ctx]=buffer(source.naturalWidth,source.naturalHeight);
 ctx.drawImage(source,0,0);
 const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
 const data=pixels.data;
 const palette=[
   [51,84,39],[69,111,46],[91,136,51],
   [118,163,59],[159,189,76]
 ];
 let changed=0;
 for(let i=0;i<data.length;i+=4){
   if(data[i+3]===0)continue;
   // Pixel-level discrete palette matching, no filtering, resampling or blur.
   const tone=data[i]*.25+data[i+1]*.7+data[i+2]*.05;
   const rank=tone<72?0:tone<106?1:tone<140?2:tone<174?3:4;
   const [r,g,b]=palette[rank];
   data[i]=r;data[i+1]=g;data[i+2]=b;changed++;
 }
 ctx.putImageData(pixels,0,0);
 return {canvas,changed,paletteEntries:palette.length};
}
function cutChip(c,im,variant,x,y){
 c.drawImage(im,(variant%4)*TILE,Math.floor(variant/4)*TILE,
   TILE,TILE,x,y,TILE,TILE);
}
function composeDryLand(art){
 // The original field groundLayer applies the sand texture to complete 32px
 // cells; at grass boundaries that leaves conspicuous square green corners.
 // Render homogeneous 32px *terrain tiles* and compose their junction using
 // exactly the approved 16-shape atlas already used at the sea edge.
 const layer=type=>{
   const map=MAP.map(row=>row.map(()=>type));
   map.paths=[];map.decorations=[];map.projectedHeights=false;
   map.referencePlacedObjects=true;map.bridgeWaterCells=new Set();
   map.textureOrigin={x:0,y:0};
   return window.YK_LANDSCAPE.groundLayer(map);
 };
 const w=WIDTH*TILE,h=HEIGHT*TILE;
 const [staticMap,c]=buffer(w,h);
 const [grassLayer,g]=buffer(w,h);
 // Sand is behind every land cell; grass is clipped to an independent
 // connected boundary mask. Neither material is stretched or retinted.
 c.drawImage(layer('sand'),0,0);
 g.drawImage(layer('grass'),0,0);
 const [grassCoverage,grassMask]=buffer(w,h);
 grassMask.fillStyle='#fff';
 grassMask.fillRect(0,0,w,h);
 const grassCover=(x,y)=>{
   const isGrass=(cx,cy)=>MAP[cy]?.[cx]==='grass';
   return (isGrass(x,y)?1:0)|(isGrass(x+1,y)?2:0)|
     (isGrass(x+1,y+1)?4:0)|(isGrass(x,y+1)?8:0);
 };
 let grassEdgeChips=0,grassDiagonalChips=0;
 for(let y=-1;y<HEIGHT;y++)for(let x=-1;x<WIDTH;x++){
   const cover=grassCover(x,y);
   if(cover===15)continue;
   const px=x*TILE+TILE/2,py=y*TILE+TILE/2;
   grassMask.clearRect(px,py,TILE,TILE);
   if(cover>0){
     cutChip(grassMask,art.mask,cover,px,py);
     grassEdgeChips++;
     if(![0,3,5,10,12,15].includes(cover))grassDiagonalChips++;
   }
 }
 g.globalCompositeOperation='destination-in';
 g.drawImage(grassCoverage,0,0);
 g.globalCompositeOperation='source-over';
 c.drawImage(grassLayer,0,0);
 // Apply the same 16-corner native chip atlas at the ocean boundary.
 // Terrain junctions are baked ONCE, not repainted per frame as overlays.
 const [coverage,m]=buffer(w,h);
 m.fillStyle='#fff';m.fillRect(0,0,w,h);
 const coastline=[];
 for(let y=-1;y<HEIGHT;y++)for(let x=-1;x<WIDTH;x++){
   const cover=shoreCover(x,y);if(cover===15)continue;
   const px=x*TILE+TILE/2,py=y*TILE+TILE/2;
   m.clearRect(px,py,TILE,TILE);
   if(cover>0){
     cutChip(m,art.mask,cover,px,py);
     coastline.push({px,py,cover,x,y});
   }
 }
 c.globalCompositeOperation='destination-in';
 c.drawImage(coverage,0,0);
 c.globalCompositeOperation='source-over';
 for(const {px,py,cover,x,y} of coastline){
   const phase=((x&1)+2*(y&1));
   cutChip(c,art.sand[phase],cover,px,py);
 }
 return {staticMap,coastline,shoreMask:coverage,
   grassEdgeChips,grassDiagonalChips,
   landJoin:'approved-16-corner-alpha-autotiles'};
}
// Compile an honest 32x32 animated mapchip sheet at scene load. Each beach
// tile receives 8 source frames; runtime ONLY copies 32x32 atlas rectangles.
// The approved 16-corner coast alpha supplies a GLOBAL, continuous surf line.
// In particular no per-tile local 0..31 edge/phase or full-world wave overlay
// is drawn during gameplay.
function buildAnimatedTileAtlas(ground){
 const width=WIDTH*TILE,height=HEIGHT*TILE;
 const alpha=ground.shoreMask.getContext('2d',{willReadFrequently:true})
   .getImageData(0,0,width,height).data;
 const shoreY=new Int32Array(width).fill(-1);
 const slots=new Map();
 for(let x=0;x<width;x++){
   let seaSeen=false;
   for(let y=0;y<height;y++){
     const a=alpha[(y*width+x)*4+3];
     if(a<128){seaSeen=true;continue;}
     if(seaSeen){shoreY[x]=y;break;}
   }
   const edge=shoreY[x];
   if(edge<0)continue;
   // Only land-near-shore chips receive the 8-frame animated material.
   for(let y=edge;y<Math.min(height,edge+18);y++){
     const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
     if(MAP[ty]?.[tx]==='grass')continue;
     const key=tx+','+ty;
     if(!slots.has(key))slots.set(key,{x:tx,y:ty,cover:shoreCover(tx,ty)});
   }
 }
 const entries=[...slots.values()].sort((a,b)=>a.y-b.y||a.x-b.x);
 const columns=16,rows=Math.ceil(entries.length/columns);
 const [sheet,ctx]=buffer(columns*TILE,rows*TILE*TIDE_FRAMES.length);
 const statistics=[];
 // Colors stay close to the approved shallow-water and sand palette.
 // World-coordinate stippling is continuous across adjacent chip borders.
 for(let phase=0;phase<TIDE_FRAMES.length;phase++){
   let wetPixels=0,washedPixels=0,foamPixels=0;
   for(let index=0;index<entries.length;index++){
     const {x:tx,y:ty}=entries[index];
     const tile=ctx.createImageData(TILE,TILE),out=tile.data;
     for(let py=0;py<TILE;py++)for(let px=0;px<TILE;px++){
       const wx=tx*TILE+px,wy=ty*TILE+py,worldIndex=(wy*width+wx)*4;
       if(alpha[worldIndex+3]<128||shoreY[wx]<0)continue;
       const effect=surfSample(wy-shoreY[wx],'sand',phase,wx);
       if(!effect)continue;
       const i=(py*TILE+px)*4;
       wetPixels++;
       if(effect===1){
         out[i]=55;out[i+1]=100;out[i+2]=105;out[i+3]=68;
       }else if(effect===2){
         washedPixels++;
         out[i]=69;out[i+1]=158;out[i+2]=177;out[i+3]=118;
       }else{
         foamPixels++;
         const dither=(wx*7+wy*13+(wx>>2))%9;
         out[i]=225+(dither%3)*7;
         out[i+1]=235+(dither%3)*5;
         out[i+2]=220+(dither%4)*7;
         out[i+3]=dither===0?142:208;
       }
     }
     ctx.putImageData(tile,(index%columns)*TILE,
       (phase*rows+Math.floor(index/columns))*TILE);
     entries[index].index=index;
   }
   statistics.push({wetPixels,washedPixels,foamPixels});
 }
 return {sheet,entries,columns,rows,frames:TIDE_FRAMES.length,
   statistics,chipSize:TILE,geometry:'approved-16-corner-mask'};
}
function input(id,dir){
 if(dir)pressed.set(id,dir);else pressed.delete(id);
 const active=[...pressed.values()].at(-1);
 for(const b of buttons)b.classList.toggle('held',b.dataset.dir===active);
}
function stop(){
 pressed.clear();for(const b of buttons)b.classList.remove('held');
}
for(const b of buttons){
 b.addEventListener('pointerdown',e=>{
   if(e.button!==0)return;e.preventDefault();b.setPointerCapture(e.pointerId);
   input(e.pointerId,b.dataset.dir);
 });
 for(const event of ['pointerup','pointercancel','lostpointercapture'])
   b.addEventListener(event,e=>input(e.pointerId,null));
 b.addEventListener('contextmenu',e=>e.preventDefault());
}
addEventListener('keydown',e=>{
 if(!keyToDir[e.key]||e.metaKey||e.altKey||e.ctrlKey)return;
 e.preventDefault();if(!e.repeat)input(e.key,keyToDir[e.key]);
});
addEventListener('keyup',e=>{if(keyToDir[e.key])input(e.key,null);});
addEventListener('blur',stop);
addEventListener('pagehide',stop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
document.querySelector('#reset').addEventListener('click',()=>{hero={...START};stride=0;stop()});
document.querySelector('#grid').addEventListener('click',e=>{
 grid=!grid;e.currentTarget.setAttribute('aria-pressed',String(grid));
});
function resize(){
 const ratio=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*ratio),h=Math.round(innerHeight*ratio);
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
 return ratio;
}
function paint(now,art,ground,tileAtlas){
 const dpr=resize(),zoom=1.18,scale=dpr*zoom;
 const viewW=canvas.width/scale,viewH=canvas.height/scale;
 camera.x=Math.max(0,Math.min(WIDTH*TILE-viewW,hero.x-viewW/2));
 camera.y=Math.max(0,Math.min(HEIGHT*TILE-viewH,hero.y-viewH/2-106));
 ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#28678e';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.setTransform(scale,0,0,scale,-Math.floor(camera.x)*scale,-Math.floor(camera.y)*scale);
 const frame=Math.floor(now/360)%2;
 const tide=tideFrame(now);
 // Draw only visible 32px terrain chips. Water is an independent
 // two-frame 32px tile layer; dry land uses the existing native terrain art.
 const minX=Math.max(0,Math.floor(camera.x/TILE)-1),
   maxX=Math.min(WIDTH-1,Math.ceil((camera.x+viewW)/TILE)+1),
   minY=Math.max(0,Math.floor(camera.y/TILE)-1),
   maxY=Math.min(HEIGHT-1,Math.ceil((camera.y+viewH)/TILE)+1);
 let baseTiles=0,animatedTiles=0;
 for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){
   if(MAP[y][x]==='sea'||Math.abs(y-SHORE_Y[x])<=1){
     ctx.drawImage(art.water,frame*64+(x&1)*TILE,(y&1)*TILE,
       TILE,TILE,x*TILE,y*TILE,TILE,TILE);
   }
 }
 // Cache the static 32px-tile layer as ONE contiguous surface instead
 // of slicing a previously composed texture back into 32px draw calls.
 // At non-integer camera zoom, independent copies can leave one-pixel gaps.
 ctx.drawImage(ground.staticMap,0,0);
 baseTiles=(maxX-minX+1)*(maxY-minY+1);
 // Synchronously swap every surf tile to the same phase. The full map
 // is never repainted by ImageData and there is no full-canvas tide overlay.
 for(const chip of tileAtlas.entries){
   if(chip.x<minX||chip.x>maxX||chip.y<minY||chip.y>maxY)continue;
   const sx=(chip.index%tileAtlas.columns)*TILE;
   const sy=(tide.phase*tileAtlas.rows+
     Math.floor(chip.index/tileAtlas.columns))*TILE;
   ctx.drawImage(tileAtlas.sheet,sx,sy,TILE,TILE,
     chip.x*TILE,chip.y*TILE,TILE,TILE);
   animatedTiles++;
 }
 if(grid){
   ctx.save();ctx.strokeStyle='rgba(252,229,162,.42)';ctx.lineWidth=.7;
   for(let x=0;x<=WIDTH;x++){ctx.beginPath();ctx.moveTo(x*TILE,0);ctx.lineTo(x*TILE,HEIGHT*TILE);ctx.stroke();}
   for(let y=0;y<=HEIGHT;y++){ctx.beginPath();ctx.moveTo(0,y*TILE);ctx.lineTo(WIDTH*TILE,y*TILE);ctx.stroke();}
   ctx.restore();
 }
 // Dress the coast with approved sprites at their *native* image size.
 // Their feet share the same world-Y sorting order as village characters.
 // No stretched tile sprites, floating rocks or arbitrary camera-scale factors.
 const actors=[
   ...SCENERY.map(object=>({type:'object',...object})),
   {type:'hero',x:hero.x,y:hero.y}
 ].sort((a,b)=>a.y-b.y||(a.type==='hero'?1:-1));
 for(const actor of actors){
   if(actor.type==='object'){
     const bitmap=actor.kind==='rock'?art.rock:art.grassTuftRender.canvas;
     const w=bitmap.naturalWidth??bitmap.width;
     const h=bitmap.naturalHeight??bitmap.height;
     ctx.drawImage(bitmap,Math.round(actor.x-w/2),Math.round(actor.y-h));
   }else{
     ctx.fillStyle='rgba(14,28,39,.34)';
     ctx.beginPath();ctx.ellipse(hero.x,hero.y-2,23,6,0,0,Math.PI*2);ctx.fill();
     // Same 80x112 image size and (40,106) foot anchor as village NPCs.
     drawCharacter(ctx,{bitmap:art.hero,x:hero.x,y:hero.y,
       face:hero.row,distance:stride,moving:walking});
   }
 }
 draws++;
 window.__SHORE_QA={ready:true,tileSize:TILE,map:[WIDTH,HEIGHT],
   waterFrames:2,waterFrame:frame,tideFrames:TIDE_FRAMES.length,
   tidePhase:tide.phase,tideReach:tide.reach,
   foamPixels:tileAtlas.statistics[tide.phase].foamPixels,
   wetPixels:tileAtlas.statistics[tide.phase].wetPixels,
   washedPixels:tileAtlas.statistics[tide.phase].washedPixels,
   tileSheet:[tileAtlas.sheet.width,tileAtlas.sheet.height],
   animatedTileCount:tileAtlas.entries.length,
   animatedTileDraws:animatedTiles,baseTileDraws:baseTiles,
   surfRender:'animated-32px-atlas-chips',
   coastCount:ground.coastline.length,characterSheet:'village-80x112',
   scenery:SCENERY.map(({id,kind,x,y,solid,radius})=>({id,kind,x,y,solid,radius})),
   sceneryCount:SCENERY.length,
   sceneryNativeSizes:{rock:[art.rock.naturalWidth,art.rock.naturalHeight],
     grassTuft:[art.grassTuft.naturalWidth,art.grassTuft.naturalHeight]},
   sceneryRender:'unscaled-native-sprites-sorted-by-foot',
   grassColorStudy:{pixelPreserved:art.grassTuftRender.changed,
     paletteSize:art.grassTuftRender.paletteEntries,scale:1},
   grassEdgeChips:ground.grassEdgeChips,
   grassDiagonalChips:ground.grassDiagonalChips,
   landJoin:ground.landJoin,
   sandCells:MAP.flat().filter(t=>t==='sand').length,
   seaCells:MAP.flat().filter(t=>t==='sea').length,
   dryMapGenerated:true,shorelineTechnique:'4-corner-16-tile-mask',
   waveLayer:'synchronous-8-frame-32px-surf-mapchip-atlas',
   hero:{...hero},grid,draws};
}
async function start(){
 const invalid=validateShore();if(invalid.length)throw Error('地形接続の規則違反: '+invalid.join('; '));
 const [art]=await Promise.all([
   (async()=>({
     hero:await initImage(source.hero),
     rock:await initImage(source.rock),
     grassTuft:await initImage(source.grassTuft),
     water:await initImage(source.water),
     mask:await initImage(source.mask),
     foam:await initImage(source.foam),
     sand:await Promise.all(source.sand.map(initImage))
   }))(),
   new Promise((resolve,reject)=>{
     const LAND=window.YK_LANDSCAPE,AUTO=window.YK_AUTOTILE;
     const until=setTimeout(()=>reject(Error('元の地形画像が読み込めません')),25000);
     const check=()=>{
       const errors={...LAND.errors,...AUTO.errors};
       if(Object.keys(errors).length){clearTimeout(until);reject(Error(JSON.stringify(errors)));return;}
       if(LAND.ready()&&AUTO.ready()){clearTimeout(until);resolve();}
     };
     LAND.load(check);AUTO.load(check);check();
   })
 ]);
 if(art.hero.naturalWidth!==240||art.hero.naturalHeight!==448)
   throw Error('緋月の村用80x112・3列×4行シートではありません');
 if(art.water.width!==128||art.water.height!==64)throw Error('承認済み水面2コマと異なります');
 for(const [id,bitmap] of [['岩',art.rock],['草',art.grassTuft]]){
   if(!bitmap.naturalWidth||!bitmap.naturalHeight||
      bitmap.naturalWidth>112||bitmap.naturalHeight>112)
     throw Error('原寸で置けない大きな'+id+'素材です');
 }
 for(const object of SCENERY){
   const tx=Math.floor(object.x/TILE),ty=Math.floor((object.y-1)/TILE);
   if(MAP[ty]?.[tx]!=='grass')throw Error('草地外のオブジェクト: '+object.id);
 }
 if(!canStandWithScenery(hero.x,hero.y))throw Error('初期位置が岩と重なっています');
 if([art.mask,art.foam,...art.sand].some(a=>a.width!==128||a.height!==128))
   throw Error('海岸16チップアトラスの寸法が異なります');
 art.grassTuftRender=grassPaletteSprite(art.grassTuft);
 const ground=composeDryLand(art);
 const tileAtlas=buildAnimatedTileAtlas(ground);
 loading.hidden=true;
 function tick(now){
   const dt=lastTime?Math.min(50,now-lastTime):0;lastTime=now;
   const dir=[...pressed.values()].at(-1);walking=false;
   if(dir){
     const [dx,dy,row]=directions[dir];hero.row=row;
     const step=150*dt/1000;
     const nx=hero.x+dx*step,ny=hero.y+dy*step;
     if(canStandWithScenery(nx,ny)){hero.x=nx;hero.y=ny;stride+=step;walking=true;}
   }
   paint(now,art,ground,tileAtlas);requestAnimationFrame(tick);
 }
 requestAnimationFrame(tick);
}
start().catch(e=>{console.error(e);loading.textContent='読み込みエラー: '+e.message;});
</script>
