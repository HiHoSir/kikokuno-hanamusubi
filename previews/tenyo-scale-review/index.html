<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- Standalone Pages review; intentionally not a playable game entry. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鬼哭の花結び">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../src/game/app.webmanifest">
<meta name="theme-color" content="#122b34">
<title>天妖の社・キャラクターと表示倍率の実機レビュー｜鬼哭の花結び</title>
<style>
:root{color-scheme:dark;background:#10232d;color:#f7efdb;font:16px system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;overscroll-behavior:none}
main{width:100%;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr)}
.viewport{position:relative;display:grid;place-items:center;overflow:hidden;background:#102d42}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
button{border:1px solid #777d62;border-radius:8px;background:#314337;color:inherit;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#load{position:absolute;inset:0;z-index:10;display:grid;place-items:center;text-align:center;background:#142c3a;padding:16px}
#load[hidden]{display:none}
#objective{display:block;color:#f7efdb;font-size:12px;line-height:1.5;text-align:left}
#interaction-hint:empty{display:none}
#pad .dpad button{font-size:21px}
#pad button.held{background:rgba(59,96,128,.96)}
@media(orientation:landscape){.field-hud{max-width:60%}}


.review-panel{position:absolute;top:7px;right:calc(112px + env(safe-area-inset-right));z-index:30;
 text-align:right;max-width:min(66vw,355px)}
.review-panel summary{display:inline-block;cursor:pointer;padding:5px 10px;min-height:29px;
 border:1px solid #c6b184;border-radius:5px;background:#1b323ce8;color:#f5e7c8;
 font-size:11px;touch-action:manipulation}
.review-panel[open]{background:rgba(18,37,45,.94);border-radius:6px;padding:3px 7px 7px}
.review-controls{display:flex;flex-direction:column;gap:5px;margin-top:5px;align-items:flex-end}
.review-control-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.review-controls button{padding:4px 7px;min-height:27px;white-space:nowrap;font-size:10px;
 border:1px solid #c6b184;border-radius:5px;background:#1b323ce8;color:#f5e7c8}
.review-controls button[aria-pressed="true"]{background:#d9ba80;color:#182a2f}
.review-legend{font-size:10px;color:#f4d9b6;margin:1px 0;text-align:right}
.collision-toggle{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;
 padding:5px 10px;min-height:29px;font-size:11px;background:rgba(27,50,60,.9);
 color:#f5e7c8;border:1px solid #c6b184}
.collision-toggle[aria-pressed="true"]{background:#d9ba80;color:#182a2f}
.review-note{position:absolute;right:8px;bottom:8px;z-index:4;
 background:rgba(13,28,37,.76);color:#f5e7c8;border:1px solid #887d63;
 padding:4px 7px;font:10px/1.3 system-ui,sans-serif;pointer-events:none;border-radius:4px;
 max-width:48%}
</style>
<link rel="stylesheet" href="../../src/game/village/dialogue.css">
<link rel="stylesheet" href="../../src/game/ui/controls.css?v=dotgothic16">
<script type="module" src="../../src/game/ui/selection-guard.mjs"></script>
<link rel="stylesheet" href="../../src/game/audio/audio.css">
<script type="module" src="../../src/game/audio/boot.mjs"></script>
</head>
<body>
<main data-bgm="prologue">
<section class="viewport" aria-label="天妖の社">
  <div class="field-hud">
    <output id="interaction-hint" aria-live="polite"></output>
    <output id="objective" aria-live="polite">天妖の社：人物と建物の原寸バランスを検査</output>
  </div>
  <canvas id="scene" width="768" height="768" aria-label="天妖の社のマップ"></canvas>
  <details class="review-panel">
    <summary aria-label="カメラ・人物・当たり判定の比較設定">検査設定</summary>
    <nav class="review-controls" aria-label="天妖の社・画角と人物サイズの比較">
    <div class="review-control-row">
      <button type="button" data-tenyo-camera="1.4" aria-pressed="false">元の画角</button>
      <button type="button" data-tenyo-camera="1" aria-pressed="true">広めの画角</button>
    </div>
    <div class="review-control-row">
      <button type="button" data-tenyo-figures="legacy" aria-pressed="true">従来の人物比</button>
      <button type="button" data-tenyo-figures="largeNpc" aria-pressed="false">人物を大きく統一</button>
    </div>
    <div class="review-control-row">
      <button type="button" data-tenyo-contact="visual" aria-pressed="true">足元に合わせた判定</button>
      <button type="button" data-tenyo-contact="legacy" aria-pressed="false">以前の判定（封鎖維持）</button>
    </div>
    <p class="review-legend">桃色：続編専用封鎖（切替不可）／黄色：門・足元／赤：深場など</p>
  </nav>
  </details>
  <button class="collision-toggle" type="button" data-tenyo-collision aria-pressed="false">判定を表示</button>
  <div class="review-note">浅瀬を歩行可／門・柵は衝突／社守の間は続編まで封鎖</div>
  <p id="load">天妖の社を読み込んでいます</p>
  <button id="talk" type="button" hidden>話す</button>
  <section id="dialogue" aria-labelledby="speaker" hidden>
    <div class="dialog-window" role="dialog" aria-modal="false">
      <strong id="speaker"></strong>
      <p id="line"></p>
      <button id="next" type="button" aria-label="次のセリフへ">▼</button>
    </div>
  </section>
</section>
<section id="pad" class="controls" aria-label="ゲーム操作">
  <div class="dpad" aria-label="十字キー・4方向移動" role="group">
    <button id="up" type="button" data-dir="up" aria-label="上">▲</button>
    <button id="left" type="button" data-dir="left" aria-label="左">◀</button>
    <button id="right" type="button" data-dir="right" aria-label="右">▶</button>
    <button id="down" type="button" data-dir="down" aria-label="下">▼</button>
  </div>
  <button id="action-b" class="round sub" type="button" aria-label="B 戻る">B<small>戻る</small></button>
  <button id="action-a" class="round main" type="button" aria-label="A 決定・話す">A<small>決定</small></button>
</section>
<button id="sound-toggle" type="button" aria-label="サウンドを再生" aria-pressed="false">♪ 再生</button>
</main>
<script src="../../src/game/tenyo/rendering/catalog.js?v=tenyo-npc-80x112"></script>
<script src="../../src/game/tenyo/rendering/autotile.js"></script>
<script src="../../src/game/tenyo/rendering/model.js"></script>
<script src="../../src/game/tenyo/rendering/render.js?v=tenyo-unified-character-foot-1"></script>
<script type="module" src="../../src/game/tenyo/walk.mjs?tenyo-review=1&amp;v=tenyo-sealed-guard-shallows-1"></script>
</body>
</html>
