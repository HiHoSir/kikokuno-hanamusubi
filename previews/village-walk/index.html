<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#19251e">
<title>鬼灯村の歩行検査｜鬼哭の花結び</title>
<style>
:root{color-scheme:dark;background:#19251e;color:#f7efdb;font:16px system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;overscroll-behavior:none}
main{width:min(100%,880px);height:100vh;height:100dvh;margin:auto;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
h1{font-size:17px;line-height:1.25;margin:0}
#status{font-size:12px;color:#dbdec6;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewport{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #73785c;border-radius:8px;background:#243322}
canvas{display:block;image-rendering:pixelated;touch-action:none}
.controls{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dpad{display:grid;grid-template-columns:repeat(3,47px);grid-template-rows:repeat(2,42px);gap:3px}
button{border:1px solid #777d62;border-radius:8px;background:#314337;color:inherit;font:inherit;min-height:40px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
button:active,button.held,button[aria-pressed=true]{background:#e8cc8b;color:#272d22}
.dpad button{font-size:19px}
[data-dir=up]{grid-column:2}
[data-dir=left]{grid-column:1;grid-row:2}
[data-dir=down]{grid-column:2;grid-row:2}
[data-dir=right]{grid-column:3;grid-row:2}
.actions{display:grid;gap:5px;width:min(100%,150px)}
.actions button{font-size:13px}
#load{position:absolute;inset:0;display:grid;place-items:center;margin:0;background:#243322;text-align:center;padding:10px}
#load[hidden]{display:none}
@media(orientation:landscape) and (max-height:520px){
 main{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
 header{grid-column:1/-1}
 .controls{flex-direction:column;justify-content:center}
}
</style>
</head>
<body>
<main>
<header><h1>鬼灯村の歩行検査</h1><output id="status">読み込み中</output></header>
<section class="viewport" aria-label="鬼灯村"><canvas id="scene"></canvas><p id="load">鬼灯村を読み込んでいます</p></section>
<section class="controls" aria-label="検査操作">
<div class="dpad" aria-label="方向ボタン">
<button type="button" data-dir="up" aria-label="上"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5 22 20H2Z"/></svg></button>
<button type="button" data-dir="left" aria-label="左"><svg viewBox="0 0 24 24" width="22" height="22" style="transform:rotate(-90deg)" aria-hidden="true"><path fill="currentColor" d="M12 5 22 20H2Z"/></svg></button>
<button type="button" data-dir="down" aria-label="下"><svg viewBox="0 0 24 24" width="22" height="22" style="transform:rotate(180deg)" aria-hidden="true"><path fill="currentColor" d="M12 5 22 20H2Z"/></svg></button>
<button type="button" data-dir="right" aria-label="右"><svg viewBox="0 0 24 24" width="22" height="22" style="transform:rotate(90deg)" aria-hidden="true"><path fill="currentColor" d="M12 5 22 20H2Z"/></svg></button>
</div>
<div class="actions">
<button id="debug" type="button" aria-pressed="false">判定を表示</button>
<button id="reset" type="button">橋の南へ戻る</button>
</div>
</section>
</main>
<script type="module" src="./walk.mjs?v=native-size-2"></script>
</body>
</html>
