<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151d19">
<title>龍神の滝 ｜ 鬼哭の花結び</title>
<style>
:root{color-scheme:dark;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#151d19;color:#fff1c9}
*{box-sizing:border-box}
html,body,main{margin:0;width:100%;height:100%;overflow:hidden}
main{position:relative;height:100dvh;background:#151d19;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
button{border:1px solid #d7ca97;border-radius:7px;background:#202b23db;color:#fff1c9;min-width:47px;min-height:45px;font:inherit;touch-action:none;-webkit-tap-highlight-color:transparent}
button[data-held]{background:#736440}
button:focus-visible{outline:2px solid white}
#controls{position:absolute;bottom:max(9px,env(safe-area-inset-bottom));left:max(12px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(3,47px);gap:3px;touch-action:none}
[data-dir=up]{grid-area:1/2}[data-dir=left]{grid-area:2/1}[data-dir=down]{grid-area:2/2}[data-dir=right]{grid-area:2/3}
#reset{position:absolute;top:max(9px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));padding:0 12px;font-size:13px}
#hint{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));right:max(10px,env(safe-area-inset-right));margin:0;padding:6px 9px;background:#15201be8;border-radius:4px;font-size:13px;pointer-events:none}
#load,#rotate{position:absolute;inset:0;display:grid;place-items:center;background:#151d19;margin:0;text-align:center}
#load[hidden],#rotate{display:none}
#fade{position:absolute;inset:0;background:#111813;opacity:0;pointer-events:none;transition:opacity .14s}
#fade.active{opacity:1}
@media(orientation:portrait){#rotate{display:grid}}
</style>
<script src="../../src/field/assets.js"></script>
<script src="../../src/field/elevation-model.js"></script>
<script src="../../src/field/landscape.js"></script>
<script src="../../src/field/autotile.js"></script>
</head>
<body>
<main>
<canvas id="scene" aria-label="龍神の滝の歩行試作"></canvas>
<div id="fade" aria-hidden="true"></div>
<div id="controls" role="group" aria-label="移動">
<button type="button" data-dir="up" aria-label="上">▲</button>
<button type="button" data-dir="left" aria-label="左">◀︎</button>
<button type="button" data-dir="down" aria-label="下">▼</button>
<button type="button" data-dir="right" aria-label="右">▶︎</button>
</div>
<button type="button" id="reset">滝壺から</button>
<p id="hint" aria-live="polite">滝の左手に洞窟がある</p>
<p id="load" role="status">読み込み中</p>
<div id="rotate" role="status">端末を横向きにしてください</div>
</main>
<script type="module" src="./walk.mjs?v=wall-stack"></script>
</body>
</html>
