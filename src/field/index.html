<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#19251e">
<title>フィールドの歩行検査｜鬼哭の花結び</title>
<style>
:root{color-scheme:dark;background:#19251e;color:#f7efdb;font:16px system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;overscroll-behavior:none}
main{width:min(100%,880px);height:100vh;height:100dvh;margin:auto;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:17px;margin:0}
output{font-size:12px;color:#dbdec6;text-align:right}
.viewport{position:relative;display:grid;place-items:center;overflow:hidden;border:1px solid #73785c;border-radius:8px;background:#243322}
canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;touch-action:none}
.sky-clouds{display:none}
@supports (width:1cqw) and (mask-image:linear-gradient(black,transparent)){
 /* Use the canvas grid cell, which can be taller than the clipped viewport. */
 .sky-clouds{
  display:block;position:absolute;grid-area:1/1/2/2;inset:0;container-type:size;
  pointer-events:none;
 }
 /* The sky starts at 32/768 and spans 136×1.2/768 of the fitted square. */
 .cloud-band{
  --scene-size:min(100cqw,100cqh);
  position:absolute;overflow:hidden;
  left:50%;top:calc(50% - var(--scene-size) * .4583333333);
  width:var(--scene-size);height:calc(var(--scene-size) * .2125);
  transform:translateX(-50%);
  mask-image:linear-gradient(black 76%,transparent);
 }
 .cloud-band::before{
  content:"";position:absolute;inset:0 auto 0 0;width:200%;image-rendering:pixelated;
  background:url("../../assets/field/effects/cloud-sky.png?v=e64806a") repeat-x 0 0 / 50% 100%;
  animation:cloud-drift 58s linear infinite;
 }
 @keyframes cloud-drift{to{transform:translateX(-50%)}}
 @media(prefers-reduced-motion:reduce){.cloud-band::before{animation:none}}
}
.dpad{display:grid;grid-template-columns:repeat(3,47px);grid-template-rows:repeat(2,42px);gap:3px;justify-self:center}
button{border:1px solid #777d62;border-radius:8px;background:#314337;color:inherit;font:19px system-ui;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button.held{background:#e8cc8b;color:#272d22}
[data-dir=up]{grid-column:2}
[data-dir=left]{grid-column:1;grid-row:2}
[data-dir=down]{grid-column:2;grid-row:2}
[data-dir=right]{grid-column:3;grid-row:2}
#load{position:absolute;inset:0;display:grid;place-items:center;margin:0;background:#243322;text-align:center}
#load[hidden]{display:none}
@media(orientation:landscape) and (max-height:520px){
 main{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
 header{grid-column:1/-1}
 .dpad{align-self:center}
}
</style>
</head>
<body>
<main>
<header><h1>フィールドの歩行検査</h1><output id="status">鬼灯村の南口</output></header>
<section class="viewport" aria-label="フィールド">
<canvas id="scene" width="768" height="768"></canvas>
<div class="sky-clouds" aria-hidden="true"><div class="cloud-band"></div></div>
<p id="load">フィールドを読み込んでいます</p>
</section>
<section class="dpad" aria-label="方向ボタン">
<button type="button" data-dir="up" aria-label="上">▲</button>
<button type="button" data-dir="left" aria-label="左">◀</button>
<button type="button" data-dir="down" aria-label="下">▼</button>
<button type="button" data-dir="right" aria-label="右">▶</button>
</section>
</main>
<script src="./assets.js?v=e044a0a"></script>
<script src="../../data/maps/field/terrain.js?v=26136fe"></script>
<script src="./elevation-model.js?v=26136fe"></script>
<script src="./field-elevation.js?v=26136fe"></script>
<script src="./world.js?v=26136fe"></script>
<script src="./landscape.js?v=26136fe"></script>
<script src="./autotile.js?v=26136fe"></script>
<script src="./elevation-view.js?v=e044a0a"></script>
<script src="./camera-position.js?v=26136fe"></script>
<script src="./movement-rules.js?v=26136fe"></script>
<script src="./area-transitions.js?v=26136fe"></script>
<script type="module" src="./walk.mjs?v=e044a0a"></script>
</body>
</html>
