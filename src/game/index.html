<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <script src="./navigation/entry.js" data-entry="shell"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="鬼哭の花結び">
  <meta name="theme-color" content="#07101e">
  <link rel="manifest" href="./app.webmanifest">
  <link rel="stylesheet" href="./audio/audio.css">
  <title>鬼哭の花結び｜本編</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07101e;overscroll-behavior:none}
    body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    #game-shell{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#07101e}
    #game-scene{display:block;width:100%;height:100%;border:0;background:#07101e;touch-action:manipulation}
    #scene-transition{position:absolute;inset:0;z-index:8;background:#07101e;pointer-events:none}
    #scene-transition[hidden]{display:none}
    #sound-toggle{z-index:50}
  </style>
  <script type="module" src="./navigation/game-shell.mjs"></script>
</head>
<body>
  <main id="game-shell">
    <iframe id="game-scene" title="鬼哭の花結び ゲーム画面" allow="autoplay" loading="eager"></iframe>
    <div id="scene-transition" aria-hidden="true"></div>
  </main>
  <button id="sound-toggle" type="button" aria-label="サウンドを再生" aria-pressed="false">♪ 再生</button>
</body>
</html>
