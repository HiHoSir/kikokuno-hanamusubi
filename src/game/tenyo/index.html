<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="../navigation/entry.js" data-entry="game"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鬼哭の花結び">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="../app.webmanifest">
<meta name="theme-color" content="#122b34">
<title>天妖の社・水上聖域｜鬼哭の花結び</title>
<style>
:root{color-scheme:dark;background:#10232d;color:#f7efdb;font:16px system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;overscroll-behavior:none}
main{width:100%;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr)}
.viewport{position:relative;display:grid;place-items:center;overflow:hidden;background:#102d42}
#scene{display:block;width:100%;height:100%;object-fit:cover;object-position:center;image-rendering:pixelated;touch-action:none}
button{border:1px solid #777d62;border-radius:8px;background:#314337;color:inherit;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#load{position:absolute;inset:0;z-index:10;display:grid;place-items:center;text-align:center;background:#142c3a;padding:16px}
#load[hidden]{display:none}
#objective{display:block;color:#f7efdb;font-size:12px;line-height:1.5;text-align:left}
#status{display:block;color:#d7dbca;font-size:12px;text-align:left}
#pad .dpad button{font-size:21px}
#pad button.held{background:rgba(59,96,128,.96)}
@media(orientation:landscape){.field-hud{max-width:60%}}
</style>
<link rel="stylesheet" href="../village/dialogue.css">
<link rel="stylesheet" href="../ui/controls.css?v=dotgothic16">
<script type="module" src="../ui/selection-guard.mjs"></script>
<link rel="stylesheet" href="../audio/audio.css">
<script type="module" src="../audio/boot.mjs"></script>
</head>
<body>
<main data-bgm="prologue">
<section class="viewport" aria-label="天妖の社">
  <div class="field-hud">
    <h1>天妖の社</h1>
    <output id="status" aria-live="polite">境内</output>
    <output id="objective" aria-live="polite">白妙を探そう</output>
  </div>
  <canvas id="scene" width="768" height="768" aria-label="天妖の社のマップ"></canvas>
  <p id="load">天妖の社を読み込んでいます</p>
  <button id="talk" type="button" hidden>話す</button>
  <section id="dialogue" aria-labelledby="speaker" hidden>
    <div class="dialog-window" role="dialog" aria-modal="false">
      <strong id="speaker"></strong>
      <p id="line"></p>
      <button id="next" type="button" aria-label="次のセリフへ">▼</button>
    </div>
  </section>
</section>
<section id="pad" class="controls" aria-label="ゲーム操作">
  <div class="dpad" aria-label="十字キー・4方向移動" role="group">
    <button id="up" type="button" data-dir="up" aria-label="上">▲</button>
    <button id="left" type="button" data-dir="left" aria-label="左">◀</button>
    <button id="right" type="button" data-dir="right" aria-label="右">▶</button>
    <button id="down" type="button" data-dir="down" aria-label="下">▼</button>
  </div>
  <button id="action-b" class="round sub" type="button" aria-label="B 戻る">B<small>戻る</small></button>
  <button id="action-a" class="round main" type="button" aria-label="A 決定・話す">A<small>決定</small></button>
</section>
<button id="sound-toggle" type="button" aria-label="サウンドを再生" aria-pressed="false">♪ 再生</button>
</main>
<script src="./rendering/catalog.js?v=tenyo-npc-80x112"></script>
<script src="./rendering/autotile.js"></script>
<script src="./rendering/model.js"></script>
<script src="./rendering/render.js?v=tenyo-proportions-052"></script>
<script type="module" src="./walk.mjs?v=20261112-tenyo-proportions-052"></script>
</body>
</html>
