<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="鬼哭の花結び">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="../game/app.webmanifest">
  <meta name="theme-color" content="#000000">
  <title>オープニング ｜ 鬼哭の花結び</title>
  <link rel="stylesheet" href="../title/title.css?v=dotgothic16">
  <style>
    .opening-screen { grid-template-rows: minmax(0, 1fr) auto; }
    #opening { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; overflow: hidden; background: #000; }
    #opening-video { display: block; width: 100%; height: 100%; max-height: 100%; object-fit: contain; background: #000; }
    #play-overlay { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 14px; padding: 20px; background: rgba(0,0,0,.42); text-align: center; }
    #play-overlay[hidden] { display: none; }
    #play-opening { min-height: 48px; border: 1px solid #ddd7c9; border-radius: 7px; padding: 12px 22px; color: #fff; background: rgba(10,10,10,.9); font: inherit; font-size: 16px; touch-action: manipulation; }
    #playback-message { max-width: 28em; margin: 0; font-size: 13px; line-height: 1.6; color: #eee9df; }
    .opening-actions { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); }
    .opening-actions a, .opening-actions button { display: grid; place-items: center; min-height: 48px; padding: 0 12px; border: 0; background: transparent; color: #eee9df; font: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: .25em; touch-action: manipulation; }
  </style>
  <script type="module" src="./opening.js"></script>
</head>
<body class="opening-screen">
  <main id="opening" aria-label="オープニングムービー">
    <video id="opening-video" playsinline webkit-playsinline controls preload="auto" aria-label="鬼哭の花結び オープニングムービー">
      <source src="../../assets/prologue/opening.mp4" type="video/mp4">
      お使いのブラウザーは動画再生に対応していません。
    </video>
    <div id="play-overlay">
      <button id="play-opening" type="button">オープニングを再生</button>
      <p id="playback-message" role="status" aria-live="polite">再生されない場合はボタンを押してください。</p>
    </div>
  </main>
  <footer class="opening-actions">
    <a href="../../">タイトルへ</a>
    <button id="skip-opening" type="button">スキップして鬼灯村へ</button>
  </footer>
</body>
</html>
